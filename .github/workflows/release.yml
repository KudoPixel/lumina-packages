name: Release Binaries and Update Manifest

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release-and-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Git Identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download All Binaries from Google Drive
        run: |
          download_tool() {
              local FILE_ID="$1"
              local FILENAME="$2"
              local URL="https://drive.usercontent.google.com/download?id=${FILE_ID}&export=download&confirm=t"
              echo "Downloading $FILENAME..."
              curl -sSL -o "$FILENAME" "$URL"
          }

          download_tool "1eiWhYPSOAdvPX4gAebBZs1G9sWli_0aH" "git-2.56.0-aarch64.tar.gz"
          download_tool "1swSEEyfo2RxqeD6v14jAr67l8BILNakK" "curl-8.23.0-aarch64.tar.gz"
          download_tool "1mlTuZvOq87EldaHWt4weTl1PtOQ_kLru" "openjdk-25.0.5-aarch64.tar.gz"
          download_tool "1jCoJ4ZrTaQjcSyDi4zcVzPZpmYBaETCV" "zsh-5.9.2-aarch64.tar.gz"
          download_tool "1jWtXVRcc-D0yCeT-ey79hi0xwubqJIsu" "aapt2-2.20-android-16.0.0_r4-aarch64.tar.gz"

          echo "All downloaded assets:"
          ls -lh *.tar.gz

      - name: Create or Update GitHub Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v1.0.0"
          
          if ! gh release view "$TAG" &>/dev/null; then
              gh release create "$TAG" -t "Lumina Binaries $TAG" --notes ""
          fi
          
          gh release upload "$TAG" *.tar.gz --clobber

      - name: Update Manifest JSON
        env:
          REPO: ${{ github.repository }}
        run: |
          TAG="v1.0.0"
          MANIFEST_DIR="android/aarch64"
          MANIFEST_FILE="$MANIFEST_DIR/manifest.json"
          
          mkdir -p "$MANIFEST_DIR"
          
          MANIFEST_VERSION=1
          if [ -f "$MANIFEST_FILE" ]; then
              CURRENT_VERSION=$(jq -r '.manifestVersion // 0' "$MANIFEST_FILE")
              MANIFEST_VERSION=$((CURRENT_VERSION + 1))
          fi
          
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          
          jq -n \
            --arg schema "1.0.0" \
            --argjson mVer "$MANIFEST_VERSION" \
            --arg platform "android" \
            --arg arch "aarch64" \
            --arg updated "$TIMESTAMP" \
            '{
              schemaVersion: $schema,
              manifestVersion: $mVer,
              platform: $platform,
              architecture: $arch,
              updatedAt: $updated,
              tools: [
                {
                  id: "git",
                  name: "Git",
                  version: "2.56.0",
                  filename: "git-2.56.0-aarch64.tar.gz",
                  downloadUrl: "https://github.com/\($ENV.REPO)/releases/download/v1.0.0/git-2.56.0-aarch64.tar.gz"
                },
                {
                  id: "curl",
                  name: "Curl",
                  version: "8.23.0",
                  filename: "curl-8.23.0-aarch64.tar.gz",
                  downloadUrl: "https://github.com/\($ENV.REPO)/releases/download/v1.0.0/curl-8.23.0-aarch64.tar.gz"
                },
                {
                  id: "openjdk",
                  name: "OpenJDK",
                  version: "25.0.5",
                  filename: "openjdk-25.0.5-aarch64.tar.gz",
                  downloadUrl: "https://github.com/\($ENV.REPO)/releases/download/v1.0.0/openjdk-25.0.5-aarch64.tar.gz"
                },
                {
                  id: "zsh",
                  name: "Zsh",
                  version: "5.9.2",
                  filename: "zsh-5.9.2-aarch64.tar.gz",
                  downloadUrl: "https://github.com/\($ENV.REPO)/releases/download/v1.0.0/zsh-5.9.2-aarch64.tar.gz"
                },
                {
                  id: "aapt2",
                  name: "AAPT2",
                  version: "2.20-android-16.0.0_r4",
                  filename: "aapt2-2.20-android-16.0.0_r4-aarch64.tar.gz",
                  downloadUrl: "https://github.com/\($ENV.REPO)/releases/download/v1.0.0/aapt2-2.20-android-16.0.0_r4-aarch64.tar.gz"
                }
              ]
            }' > "$MANIFEST_FILE"
          
          echo "Updated Manifest Content:"
          cat "$MANIFEST_FILE"
          
          git add "$MANIFEST_FILE"
          git commit -m "chore(manifest): update fixed zsh binary and manifest version $MANIFEST_VERSION" || echo "No changes to commit"
          git push origin HEAD:main
